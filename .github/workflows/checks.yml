name: Reproduce
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  correctness:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -v
      - run: python -m tools.vectors
  cryptanalysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r cryptanalysis/requirements.txt
      - run: python -m cryptanalysis.reproduce --output replay-ci.json
      - run: python -c "import json; from pathlib import Path; assert json.loads(Path('replay-ci.json').read_text()) == json.loads(Path('cryptanalysis/results.json').read_text())"
